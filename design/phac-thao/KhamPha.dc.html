<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; } a:hover { opacity: 0.75; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="padding: 16px 20px 0 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.03em;">Khám phá</div>
    <div style="height: 32px; padding: 0 12px; border-radius: 16px; border: 2px solid {{t.line}}; display: flex; align-items: center; font-size: 13px; font-weight: 600;">Huế</div>
  </div>

  <div style="margin: 12px 20px 0 20px; height: 52px; border-radius: 26px; border: 2px solid {{t.line}}; background: {{t.surface}}; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-size: 15px; color: {{t.muted}};">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    Tìm món, tên quán…
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 20px 0 20px; overflow: hidden; font-size: 14px; font-weight: 600;">
    <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; border: 2px solid {{t.line}}; position: relative; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      <div style="position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; border-radius: 10px; background: {{accent}}; color: #1A1612; border: 2px solid {{t.line}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</div>
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{t.line}}; color: {{t.bg}}; display: flex; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      Đang mở
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{t.line}}; color: {{t.bg}}; display: flex; align-items: center; gap: 6px;">
      Bánh Huế
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid {{t.line}}; display: flex; align-items: center; gap: 4px;">
      Giá
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0 20px; font-size: 13.5px;">
    <div style="font-weight: 600;">4 chỗ đang mở</div>
    <div style="display: flex; align-items: center; gap: 4px; color: {{t.muted}};">
      WGo chấm cao nhất
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="padding: 10px 20px 0 20px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{places}}" as="p" hint-placeholder-count="4">
      <div style="border: 2px solid {{t.line}}; border-radius: 20px; background: {{t.surface}}; padding: 10px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 78px; height: 78px; flex-shrink: 0; border-radius: 14px; border: 2px solid {{t.line}}; background: repeating-linear-gradient(135deg, {{t.ph}} 0 8px, {{t.ph2}} 8px 16px);"></div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
            <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap;">{{p.name}}</div>
            <div style="font-size: 14px; font-weight: 700; white-space: nowrap;">{{p.rate}}★</div>
          </div>
          <div style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.dishes}}</div>
          <div style="font-size: 13px; white-space: nowrap;"><span style="color: {{t.ok}}; font-weight: 600;">Tới {{p.close}}</span> · {{p.price}} · {{p.area}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; height: 64px; border-radius: 32px; background: {{t.line}}; color: {{t.bg}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px; font-size: 13px; font-weight: 600;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
      Gợi ý
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <div style="height: 46px; padding: 0 14px; border-radius: 23px; background: {{accent}}; color: #1A1612; display: flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        Khám phá
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
      Đã lưu
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F2B01E","options":["#F2B01E","#FF8A5B","#8FD14F","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#F2B01E';
    const t = dark
      ? { bg: '#15120E', surface: '#211D17', text: '#F6EFE2', muted: '#A89E8E', line: '#E9E1D2', ok: '#6FD39B', ph: '#2A251D', ph2: '#252019' }
      : { bg: '#F6F0E4', surface: '#FFFDF8', text: '#1A1612', muted: '#6F665A', line: '#1A1612', ok: '#1E7F4F', ph: '#EBE2D1', ph2: '#E4DAC6' };
    const places = [
      { name: 'Quán Bà Đỏ', rate: '4.6', dishes: 'Bánh nậm · bèo · lọc · khoái', close: '20:00', price: '10–60k', area: 'Gia Hội' },
      { name: 'Bà Cư', rate: '4.4', dishes: 'Bánh bèo · nậm · ướt · ram ít', close: '21:00', price: '20–30k', area: 'Bờ Nam' },
      { name: 'Huế Xưa', rate: '4.2', dishes: 'Mâm bánh Huế · nem lụi', close: '21:00', price: '30–150k', area: 'Gia Hội' },
      { name: 'Quán Thúy', rate: '4.2', dishes: 'Bánh canh Nam Phổ · bánh bèo', close: '20:00', price: '20–30k', area: 'Bờ Nam' }
    ];
    return { t, accent, places };
  }
}
</script>
</body>
</html>
