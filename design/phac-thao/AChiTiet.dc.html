<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #7C4DDB; text-decoration: none; } a:hover { color: #5E35B1; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="height: 290px; position: relative; background: repeating-linear-gradient(135deg, {{t.ph}} 0 12px, {{t.ph2}} 12px 24px);">
    <div style="position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 13px; color: {{t.muted}};">Ảnh quán (bạn sẽ bổ sung)</div>
    <div style="position: absolute; left: 16px; right: 16px; top: 12px; display: flex; justify-content: space-between;">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </div>
      <div style="display: flex; gap: 10px;">
        <div style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 262px; bottom: 0; background: {{t.bg}}; border-radius: 28px 28px 0 0; padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px;">
      <div style="height: 26px; padding: 0 10px; border-radius: 13px; border: 1px dashed {{t.muted}}; color: {{t.muted}}; display: flex; align-items: center;">Chưa kiểm chứng</div>
      <div style="color: {{t.muted}};">Quán ăn · Bún bò</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;">Bún bò Mệ Kéo</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{t.muted}};">
        <div style="display: flex; align-items: center; gap: 4px; color: {{t.text}}; font-weight: 700;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"></path></svg>
          4.8
        </div>
        <div>WGo chấm</div><div>·</div><div>40–50k</div><div>·</div><div>Gia Hội</div>
      </div>
    </div>

    <div style="padding: 14px 16px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 10px; height: 10px; border-radius: 5px; background: {{t.ok}};"></div>
        <div style="font-size: 15px;"><span style="color: {{t.ok}}; font-weight: 600;">Đang mở</span> · đóng lúc 08:00</div>
      </div>
      <div style="font-size: 13px; color: {{t.muted}};">06:00–08:00</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 13px; color: {{t.muted}};">Nên gọi</div>
      <div style="font-size: 16px; font-weight: 600;">Bún bò giò chả</div>
    </div>

    <div style="padding: 12px 14px; border-radius: 16px; background: {{soft}}; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45;">
      <div style="color: {{accent}}; padding-top: 1px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
      </div>
      <div>Bán rất sớm và nhanh hết. Nên tới trước 7h.</div>
    </div>

    <div style="display: flex; gap: 8px; font-size: 13px; font-weight: 500;">
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Local</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Lâu đời</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Ăn sáng</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <div style="flex-grow: 1;">94 Bạch Đằng, Huế</div>
      <div style="color: {{t.muted}};">1,2 km</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 26px 20px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; gap: 12px;">
    <div style="width: 54px; height: 54px; border-radius: 18px; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M8 8l4-4 4 4"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
    </div>
    <div style="flex-grow: 1; height: 54px; border-radius: 18px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l16-7-7 16-2-7z"></path></svg>
      Chỉ đường
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#7C4DDB","options":["#7C4DDB","#E0572F","#0F8C7B","#2F6FDB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#7C4DDB';
    const t = dark
      ? { bg: '#131118', surface: '#1D1A24', text: '#F3F1F7', muted: '#A29DAE', line: '#2B2734', ok: '#4CC38A', ph: '#2A2536', ph2: '#26212F' }
      : { bg: '#F8F7FB', surface: '#FFFFFF', text: '#1C1A22', muted: '#6E6A78', line: '#ECE9F2', ok: '#1F8F5F', ph: '#E9E4F2', ph2: '#E2DCEE' };
    return { t, accent, soft: 'color-mix(in oklch, ' + accent + ' 13%, ' + t.surface + ')' };
  }
}
</script>
</body>
</html>
