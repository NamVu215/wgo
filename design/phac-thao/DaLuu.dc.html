<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; } a:hover { opacity: 0.75; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.03em;">Đã lưu</div>
    <div style="font-size: 13.5px; color: {{t.muted}};">3 chỗ · chỉ lưu trên điện thoại này</div>
  </div>

  <div style="margin: 16px 20px 0 20px; height: 56px; border-radius: 28px; border: 2px solid {{t.line}}; background: {{accent}}; color: #1A1612; box-shadow: 4px 4px 0 {{t.line}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15.5px; font-weight: 600;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="9" cy="9" r="1.2" fill="currentColor"></circle><circle cx="15" cy="15" r="1.2" fill="currentColor"></circle><circle cx="15" cy="9" r="1.2" fill="currentColor"></circle><circle cx="9" cy="15" r="1.2" fill="currentColor"></circle></svg>
    Bốc 1 chỗ đang mở trong đây
  </div>

  <div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{places}}" as="p" hint-placeholder-count="3">
      <div style="border: 2px solid {{t.line}}; border-radius: 20px; background: {{t.surface}}; padding: 10px; display: flex; gap: 12px; align-items: center; opacity: {{p.opacity}};">
        <div style="width: 70px; height: 70px; flex-shrink: 0; border-radius: 14px; border: 2px solid {{t.line}}; background: repeating-linear-gradient(135deg, {{t.ph}} 0 8px, {{t.ph2}} 8px 16px);"></div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap;">{{p.name}}</div>
          <div style="font-size: 13px; color: {{t.muted}};">{{p.meta}}</div>
          <div style="font-size: 13px; font-weight: 600; color: {{p.statusColor}};">{{p.status}}</div>
        </div>
        <div style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: {{t.text}};">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; height: 64px; border-radius: 32px; background: {{t.line}}; color: {{t.bg}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px; font-size: 13px; font-weight: 600;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
      Gợi ý
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Khám phá
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <div style="height: 46px; padding: 0 16px; border-radius: 23px; background: {{accent}}; color: #1A1612; display: flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
        Đã lưu
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F2B01E","options":["#F2B01E","#FF8A5B","#8FD14F","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#F2B01E';
    const t = dark
      ? { bg: '#15120E', surface: '#211D17', text: '#F6EFE2', muted: '#A89E8E', line: '#E9E1D2', ok: '#6FD39B', closed: '#F08A6C', ph: '#2A251D', ph2: '#252019' }
      : { bg: '#F6F0E4', surface: '#FFFDF8', text: '#1A1612', muted: '#6F665A', line: '#1A1612', ok: '#1E7F4F', closed: '#B2472C', ph: '#EBE2D1', ph2: '#E4DAC6' };
    const places = [
      { name: 'Chè Hẻm', meta: 'Chè · 10–25k · Bờ Nam', status: 'Đang mở · tới 22:00', open: true },
      { name: 'Café Vỹ Dạ Xưa', meta: 'Cafe · 30–70k · Vỹ Dạ', status: 'Đang mở · tới 22:00', open: true },
      { name: 'Bún bò Mệ Kéo', meta: 'Bún bò · 40–50k · Gia Hội', status: 'Đã đóng · mở lại 06:00 sáng mai', open: false }
    ].map((p) => ({ ...p, statusColor: p.open ? t.ok : t.closed, opacity: p.open ? '1' : '0.72' }));
    return { t, accent, places };
  }
}
</script>
</body>
</html>
