<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; } a:hover { opacity: 0.75; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{t.scrim}};"></div>

  <div style="position: absolute; left: 0; right: 0; top: 78px; bottom: 0; background: {{t.bg}}; border-top: 2px solid {{t.line}}; border-radius: 28px 28px 0 0; padding: 10px 20px 0 20px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{t.muted}};"></div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.03em;">Bộ lọc</div>
        <div style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">Xóa hết</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}};">GIỜ</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600;">
        <sc-for list="{{hours}}" as="c" hint-placeholder-count="5">
          <div style="height: 44px; padding: 0 13px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center;">{{c.label}}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}};">LOẠI</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 14px; font-weight: 600;">
        <sc-for list="{{kinds}}" as="c" hint-placeholder-count="4">
          <div style="height: 48px; padding: 0 14px; border-radius: 16px; border: 2px solid {{t.line}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center;">{{c.label}}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}};">MÓN</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600;">
        <sc-for list="{{dishes}}" as="c" hint-placeholder-count="10">
          <div style="height: 44px; padding: 0 13px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center;">{{c.label}}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}};">GIÁ MỖI NGƯỜI</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 13.5px; font-weight: 600;">
        <sc-for list="{{prices}}" as="c" hint-placeholder-count="4">
          <div style="height: 44px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{c.label}}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 58px; border-radius: 29px; background: {{t.line}}; color: {{t.bg}}; box-shadow: 4px 4px 0 {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">Xem 3 chỗ</div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F2B01E","options":["#F2B01E","#FF8A5B","#8FD14F","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#F2B01E';
    const t = dark
      ? { bg: '#15120E', text: '#F6EFE2', muted: '#A89E8E', line: '#E9E1D2', scrim: 'rgba(0, 0, 0, 0.6)' }
      : { bg: '#F6F0E4', text: '#1A1612', muted: '#6F665A', line: '#1A1612', scrim: 'rgba(26, 22, 18, 0.45)' };
    const chips = (labels, on) => labels.map((label) => ({
      label, bg: on.includes(label) ? t.line : 'transparent', fg: on.includes(label) ? t.bg : t.text
    }));
    return {
      t, accent,
      hours: chips(['Đang mở', 'Sáng', 'Trưa', 'Tối', 'Khuya'], ['Đang mở']),
      kinds: chips(['Quán ăn', 'Chè & nước', 'Cafe', 'Check-in'], ['Quán ăn']),
      dishes: chips(['Bún bò', 'Cơm hến', 'Bún hến', 'Bánh canh', 'Bánh bèo', 'Bánh nậm', 'Bánh lọc', 'Bánh khoái', 'Nem lụi', 'Chè'], ['Bánh bèo', 'Bánh nậm', 'Bánh lọc']),
      prices: chips(['< 30k', '30–60k', '60–100k', '> 100k'], ['< 30k', '30–60k'])
    };
  }
}
</script>
</body>
</html>
