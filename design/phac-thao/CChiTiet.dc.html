<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F8C7B; text-decoration: none; } a:hover { color: #0A6B5E; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.surface}}; color: {{t.text}}; font-family: 'Lexend', system-ui, -apple-system, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 230px; overflow: hidden;">
    <svg width="390" height="230" viewBox="0 0 390 230">
      <rect x="0" y="0" width="390" height="230" fill="{{t.land}}"></rect>
      <path d="M-20 200 C 80 170, 170 150, 250 120 S 360 60, 420 50" fill="none" stroke="{{t.water}}" stroke-width="40" stroke-linecap="round"></path>
      <g fill="none" stroke="{{t.road}}" stroke-width="7" stroke-linecap="round">
        <path d="M-10 90 L 400 40"></path>
        <path d="M150 -10 L 175 240"></path>
        <path d="M-10 250 C 90 220, 180 200, 260 170 S 360 120, 410 110"></path>
        <path d="M280 -10 L 310 110"></path>
      </g>
    </svg>
    <div style="position: absolute; left: 173px; top: 70px; width: 44px; height: 44px; border-radius: 22px 22px 22px 6px; transform: rotate(-45deg); background: {{accent}}; border: 3px solid {{t.surface}}; display: flex; align-items: center; justify-content: center;">
      <div style="width: 14px; height: 14px; border-radius: 7px; background: {{t.surface}};"></div>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; top: 12px; display: flex; justify-content: space-between;">
      <div style="width: 44px; height: 44px; border-radius: 16px; background: {{t.surface}}; box-shadow: 0 4px 14px rgba(10, 30, 25, 0.14); display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 16px; background: {{t.surface}}; box-shadow: 0 4px 14px rgba(10, 30, 25, 0.14); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 206px; bottom: 0; background: {{t.surface}}; border-radius: 26px 26px 0 0; padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{t.line}};"></div>
    <div style="display: flex; gap: 14px; align-items: center;">
      <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 16px; background: repeating-linear-gradient(135deg, {{t.ph}} 0 8px, {{t.ph2}} 8px 16px);"></div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Quán Bà Đỏ</div>
        <div style="font-size: 13.5px; color: {{t.muted}};">Bánh bèo · nậm · lọc · khoái</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="min-height: 52px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid {{t.line}}; font-size: 15px;">
        <div style="color: {{accent}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div>
        <div style="flex-grow: 1;"><span style="color: {{accent}}; font-weight: 600;">Đang mở</span> · 08:00–20:00</div>
      </div>
      <div style="min-height: 52px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid {{t.line}}; font-size: 15px;">
        <div style="color: {{t.muted}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5z"></path><circle cx="8" cy="8.5" r="1.3"></circle></svg></div>
        <div style="flex-grow: 1;">10.000–60.000đ</div>
      </div>
      <div style="min-height: 52px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid {{t.line}}; font-size: 15px;">
        <div style="color: {{t.muted}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"></path></svg></div>
        <div style="flex-grow: 1;">WGo chấm <span style="font-weight: 600;">4.6</span></div>
      </div>
      <div style="min-height: 52px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid {{t.line}}; font-size: 15px;">
        <div style="color: {{t.muted}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></div>
        <div style="flex-grow: 1;">8 Nguyễn Bỉnh Khiêm</div>
        <div style="font-size: 13px; color: {{t.muted}};">650 m</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 13px; color: {{t.muted}};">Nên gọi</div>
      <div style="font-size: 16px; font-weight: 500;">Bánh nậm + bánh bèo chén</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 13px; color: {{t.muted}};">Mẹo</div>
      <div style="font-size: 15px; line-height: 1.45;">Bánh bèo khoảng 60k cho 15 chén.</div>
    </div>
    <div style="font-size: 12.5px; color: {{t.muted}};">Chưa kiểm chứng · cập nhật 13/09/2026</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 26px 20px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; gap: 10px;">
    <div style="width: 54px; height: 54px; border-radius: 16px; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M8 8l4-4 4 4"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
    </div>
    <div style="flex-grow: 1; height: 54px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l16-7-7 16-2-7z"></path></svg>
      Chỉ đường · 650 m
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#0F8C7B","options":["#0F8C7B","#7C4DDB","#E0572F","#2F6FDB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#0F8C7B';
    const t = dark
      ? { land: '#111816', water: '#1C3A3F', road: '#222D29', surface: '#1A2320', text: '#EAF1EE', muted: '#93A29C', line: '#2A3531', ph: '#24302C', ph2: '#202A27' }
      : { land: '#ECF0EE', water: '#C3DEE1', road: '#FFFFFF', surface: '#FFFFFF', text: '#13201C', muted: '#62706B', line: '#E1E7E4', ph: '#E3EAE6', ph2: '#DAE3DE' };
    return { t, accent };
  }
}
</script>
</body>
</html>
