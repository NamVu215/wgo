<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; } a:hover { opacity: 0.75; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 27px; font-weight: 800; letter-spacing: -0.03em;">WGo</div>
      <div style="height: 32px; padding: 0 10px 0 12px; border-radius: 16px; border: 2px solid {{t.line}}; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;">
        Huế
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid {{t.line}}; display: flex; align-items: center; justify-content: center;">
      <sc-if value="{{t.isDark}}" hint-placeholder-val="{{ false }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{t.isLight}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      </sc-if>
    </div>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 14px; color: {{t.muted}}; font-weight: 500;">Chủ nhật · 19:30</div>
    <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 46px; font-weight: 800; line-height: 1.0; letter-spacing: -0.035em;">Tối nay<br><span style="background: {{accent}}; color: #1A1612; padding: 0 8px; border-radius: 10px;">ăn gì</span> đây?</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 20px 0 20px; overflow: hidden; font-size: 14px; font-weight: 600;">
    <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
      <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{m.bg}}; color: {{m.fg}}; display: flex; align-items: center;">{{m.label}}</div>
    </sc-for>
  </div>

  <div style="margin: 18px 20px 0 20px; border: 2px solid {{t.line}}; border-radius: 24px; background: {{t.surface}}; box-shadow: 5px 5px 0 {{t.line}}; overflow: hidden;">
    <div style="height: 120px; position: relative; border-bottom: 2px solid {{t.line}}; background: repeating-linear-gradient(135deg, {{t.ph}} 0 12px, {{t.ph2}} 12px 24px);">
      <div style="position: absolute; left: 14px; top: 14px; transform: rotate(-4deg); height: 30px; padding: 0 12px; border-radius: 8px; border: 2px solid #1A1612; background: {{accent}}; color: #1A1612; display: flex; align-items: center; font-size: 13px; font-weight: 700;">WGo gợi ý</div>
      <div style="position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 22px; border: 2px solid {{t.line}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
      </div>
    </div>
    <div style="padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
        <div style="font-family: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Bún bò Bà Nga</div>
        <div style="font-size: 15px; font-weight: 700; white-space: nowrap;">4.5★</div>
      </div>
      <div style="font-size: 14px; color: {{t.muted}};">Bún bò cay · 30–45k · Thành Nội</div>
      <div style="font-size: 14px; font-weight: 600; color: {{t.ok}};">Đang mở · tới 23:00</div>
      <div style="display: flex; gap: 10px; padding-top: 8px;">
        <div style="flex-grow: 1; height: 52px; border-radius: 26px; background: {{t.line}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l16-7-7 16-2-7z"></path></svg>
          Đi luôn
        </div>
        <div style="height: 52px; padding: 0 18px; border-radius: 26px; border: 2px solid {{t.line}}; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3.5c2 0 3 1 4.5 3.5S14.5 17 16.5 17H20"></path><path d="M4 17h3.5c1.2 0 2-.4 2.8-1.2M13.7 8.2c.8-.8 1.6-1.2 2.8-1.2H20"></path><path d="M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"></path></svg>
          Đổi quán
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0 20px;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}};">THÈM MÓN GÌ?</div>
    <div style="font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">Tất cả món</div>
  </div>
  <div style="display: flex; gap: 12px; padding: 10px 20px 0 20px; overflow: hidden;">
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="6">
      <div style="flex-shrink: 0; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 58px; height: 58px; border-radius: 18px; border: 2px solid {{t.line}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{d.bowl}}" hint-placeholder-val="{{ true }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"></path><path d="M8 7.5c0-1.5 1-1.5 1-3M12 7.5c0-1.5 1-1.5 1-3M16 7.5c0-1.5 1-1.5 1-3"></path></svg></sc-if>
          <sc-if value="{{d.rice}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h17a8.5 8.5 0 0 1-17 0z"></path><path d="M6.5 12a5.5 4.5 0 0 1 11 0"></path></svg></sc-if>
          <sc-if value="{{d.dish}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5h8a4 4 0 0 1-8 0z"></path><path d="M13 10.5h8a4 4 0 0 1-8 0z"></path><path d="M8 16.5h8a4 4 0 0 1-8 0z"></path></svg></sc-if>
          <sc-if value="{{d.pancake}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16a9 9 0 0 1 18 0z"></path><path d="M8.5 13l1.5-2M13.5 12l1-2"></path></svg></sc-if>
          <sc-if value="{{d.skewer}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-4"></path><path d="M8.2 15.8l6.6-6.6a2.6 2.6 0 0 0-3.7-3.7L4.5 12.1a2.6 2.6 0 0 0 3.7 3.7z"></path><path d="M15 9l5-5"></path></svg></sc-if>
          <sc-if value="{{d.che}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10l-1.5 16h-7z"></path><path d="M7.6 10h8.8"></path><circle cx="10.5" cy="14" r="1"></circle><circle cx="13.5" cy="16.5" r="1"></circle></svg></sc-if>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; text-align: center; white-space: nowrap;">{{d.label}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; height: 64px; border-radius: 32px; background: {{t.line}}; color: {{t.bg}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px; font-size: 13px; font-weight: 600;">
    <div style="display: flex; align-items: center; justify-content: center;">
      <div style="height: 46px; padding: 0 16px; border-radius: 23px; background: {{accent}}; color: #1A1612; display: flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
        Gợi ý
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Khám phá
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
      Đã lưu
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F2B01E","options":["#F2B01E","#FF8A5B","#8FD14F","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#F2B01E';
    const t = dark
      ? { isDark: true, isLight: false, bg: '#15120E', surface: '#211D17', text: '#F6EFE2', muted: '#A89E8E', line: '#E9E1D2', ok: '#6FD39B', ph: '#2A251D', ph2: '#252019' }
      : { isDark: false, isLight: true, bg: '#F6F0E4', surface: '#FFFDF8', text: '#1A1612', muted: '#6F665A', line: '#1A1612', ok: '#1E7F4F', ph: '#EBE2D1', ph2: '#E4DAC6' };
    const moods = ['Ăn no', 'Ăn vặt', 'Chè & nước', 'Cafe', 'Check-in'].map((label, i) => ({
      label, bg: i === 0 ? t.line : 'transparent', fg: i === 0 ? t.bg : t.text
    }));
    const dishes = [
      { label: 'Bún bò', bowl: true }, { label: 'Cơm hến', rice: true }, { label: 'Bánh bèo', dish: true },
      { label: 'Bánh khoái', pancake: true }, { label: 'Nem lụi', skewer: true }, { label: 'Chè', che: true }
    ];
    return { t, accent, moods, dishes };
  }
}
</script>
</body>
</html>
