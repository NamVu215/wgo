<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #7C4DDB; text-decoration: none; } a:hover { color: #5E35B1; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0 20px;">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.04em;">W<span style="color: {{accent}}">Go</span></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        Huế
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      </div>
    </div>
  </div>

  <div style="margin: 14px 20px 0 20px; height: 50px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: {{t.muted}}; font-size: 15px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    Tìm món, quán, chỗ đi chơi…
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 20px 0 20px; overflow: hidden; font-size: 14px; font-weight: 500;">
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
      Đang mở
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Gần tôi</div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Dưới 50k</div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center;">Hợp hẹn hò</div>
  </div>

  <div style="margin: 16px 20px 0 20px; padding: 16px 6px 14px 6px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; column-gap: 4px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="width: 54px; height: 54px; border-radius: 18px; background: {{soft}}; color: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{c.bowl}}" hint-placeholder-val="{{ true }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"></path><path d="M8 7.5c0-1.5 1-1.5 1-3M12 7.5c0-1.5 1-1.5 1-3M16 7.5c0-1.5 1-1.5 1-3"></path></svg></sc-if>
          <sc-if value="{{c.rice}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h17a8.5 8.5 0 0 1-17 0z"></path><path d="M6.5 12a5.5 4.5 0 0 1 11 0"></path></svg></sc-if>
          <sc-if value="{{c.dish}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5h8a4 4 0 0 1-8 0z"></path><path d="M13 10.5h8a4 4 0 0 1-8 0z"></path><path d="M8 16.5h8a4 4 0 0 1-8 0z"></path></svg></sc-if>
          <sc-if value="{{c.pancake}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16a9 9 0 0 1 18 0z"></path><path d="M8.5 13l1.5-2M13.5 12l1-2"></path></svg></sc-if>
          <sc-if value="{{c.skewer}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-4"></path><path d="M8.2 15.8l6.6-6.6a2.6 2.6 0 0 0-3.7-3.7L4.5 12.1a2.6 2.6 0 0 0 3.7 3.7z"></path><path d="M15 9l5-5"></path></svg></sc-if>
          <sc-if value="{{c.che}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10l-1.5 16h-7z"></path><path d="M7.6 10h8.8"></path><circle cx="10.5" cy="14" r="1"></circle><circle cx="13.5" cy="16.5" r="1"></circle></svg></sc-if>
          <sc-if value="{{c.coffee}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"></path><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M9 3.5c0 1.5-1 1.5-1 3M12.5 3.5c0 1.5-1 1.5-1 3"></path></svg></sc-if>
          <sc-if value="{{c.camera}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"></rect><circle cx="12" cy="13.5" r="3.5"></circle><path d="M8.5 7l1.5-2.5h4L15.5 7"></path></svg></sc-if>
        </div>
        <div style="font-size: 12.5px; font-weight: 500; text-align: center; line-height: 1.25;">{{c.label}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 22px 20px 0 20px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Sáng nay nên ăn</div>
      <div style="font-size: 13px; color: {{t.muted}};">07:15 · 9 chỗ đang mở</div>
    </div>
    <a href="#" style="font-size: 14px; font-weight: 600; color: {{accent}}; height: 44px; display: flex; align-items: center;">Xem hết</a>
  </div>

  <div style="display: flex; gap: 12px; padding: 10px 20px 0 20px; overflow: hidden;">
    <sc-for list="{{picks}}" as="p" hint-placeholder-count="3">
      <div style="flex-shrink: 0; width: 214px; border-radius: 20px; overflow: hidden; background: {{t.surface}}; border: 1px solid {{t.line}};">
        <div style="height: 112px; position: relative; background: repeating-linear-gradient(135deg, {{t.ph}} 0 10px, {{t.ph2}} 10px 20px);">
          <div style="position: absolute; left: 10px; top: 10px; height: 26px; padding: 0 9px; border-radius: 13px; background: {{t.surface}}; display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.5l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"></path></svg>
            {{p.rate}}
          </div>
        </div>
        <div style="padding: 11px 12px 13px 12px; display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 600;">{{p.name}}</div>
          <div style="font-size: 12.5px; color: {{t.ok}}; font-weight: 500;">Đang mở · đến {{p.close}}</div>
          <div style="font-size: 12.5px; color: {{t.muted}};">{{p.meta}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; font-size: 11.5px; font-weight: 500; color: {{t.muted}};">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      Khám phá
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6z"></path><path d="M9 4v14M15 6v14"></path></svg>
      Bản đồ
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -26px; color: {{t.text}}; font-weight: 600;">
      <div style="width: 58px; height: 58px; border-radius: 29px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid {{t.surface}};">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="9" cy="9" r="1.2" fill="currentColor"></circle><circle cx="15" cy="15" r="1.2" fill="currentColor"></circle><circle cx="15" cy="9" r="1.2" fill="currentColor"></circle><circle cx="9" cy="15" r="1.2" fill="currentColor"></circle></svg>
      </div>
      Bốc quán
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
      Đã lưu
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path><path d="M12 8.5v4M10 10.5h4"></path></svg>
      Góp ý
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#7C4DDB","options":["#7C4DDB","#E0572F","#0F8C7B","#2F6FDB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#7C4DDB';
    const t = dark
      ? { bg: '#131118', surface: '#1D1A24', text: '#F3F1F7', muted: '#A29DAE', line: '#2B2734', ok: '#4CC38A', ph: '#2A2536', ph2: '#26212F' }
      : { bg: '#F8F7FB', surface: '#FFFFFF', text: '#1C1A22', muted: '#6E6A78', line: '#ECE9F2', ok: '#1F8F5F', ph: '#E9E4F2', ph2: '#E2DCEE' };
    const cats = [
      { label: 'Bún bò', bowl: true }, { label: 'Cơm hến', rice: true }, { label: 'Bèo nậm lọc', dish: true }, { label: 'Bánh khoái', pancake: true },
      { label: 'Nem lụi', skewer: true }, { label: 'Chè', che: true }, { label: 'Cafe', coffee: true }, { label: 'Check-in', camera: true }
    ];
    const picks = [
      { name: 'Bún bò Mệ Kéo', close: '08:00', meta: 'Gia Hội · 40–50k', rate: '4.8' },
      { name: 'Cơm hến Hoa Đông', close: '11:00', meta: 'Vỹ Dạ · 10–25k', rate: '4.6' },
      { name: 'Bún bò Mụ Rơi', close: '10:00', meta: 'Thành Nội · 35–50k', rate: '4.5' }
    ];
    return { t, accent, soft: 'color-mix(in oklch, ' + accent + ' 13%, ' + t.surface + ')', cats, picks };
  }
}
</script>
</body>
</html>
